name: Release plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: dotnet restore metaX-jellyfin.sln

      - name: Test
        run: dotnet test metaX-jellyfin.sln -c Release --no-restore

      - name: Build
        run: dotnet build Jellyfin.Plugin.MetaX/Jellyfin.Plugin.MetaX.csproj -c Release --no-restore

      - name: Create release and manifest
        shell: bash
        run: |
          set -euo pipefail

          version="$(dotnet msbuild Jellyfin.Plugin.MetaX/Jellyfin.Plugin.MetaX.csproj -getProperty:Version -nologo | tr -d '\r' | tail -n 1)"
          tag="${GITHUB_REF_NAME}"

          if [[ -z "$version" ]]; then
            echo "Could not read the plugin version from the project file." >&2
            exit 1
          fi

          if [[ "$tag" != "v$version" ]]; then
            echo "Tag $tag does not match plugin version v$version." >&2
            exit 1
          fi

          zip="Jellyfin.Plugin.MetaX/bin/Jellyfin.MetaX@v${version}.zip"
          if [[ ! -f "$zip" ]]; then
            echo "Plugin archive not found: $zip" >&2
            find Jellyfin.Plugin.MetaX/bin -maxdepth 2 -type f -print >&2 || true
            exit 1
          fi

          checksum="$(md5sum "$zip" | awk '{print $1}')"
          timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 - "$zip" "$version" "$checksum" "$timestamp" "$tag" <<'PY'
          import json
          import pathlib
          import sys

          zip_path, version, checksum, timestamp, tag = sys.argv[1:]
          meta = json.loads(
              pathlib.Path("Jellyfin.Plugin.MetaX/meta.json").read_text(encoding="utf-8")
          )
          repo = "strange-dragon/metaX-jellyfin"
          manifest = [
              {
                  "guid": meta["guid"],
                  "name": meta["name"],
                  "description": meta["description"],
                  "overview": meta["overview"],
                  "owner": meta["owner"],
                  "category": meta["category"],
                  "imageUrl": f"https://raw.githubusercontent.com/{repo}/main/Jellyfin.Plugin.MetaX/thumb.png",
                  "versions": [
                      {
                          "version": version,
                          "changelog": meta.get("changelog", ""),
                          "targetAbi": meta["targetAbi"],
                          "sourceUrl": f"https://github.com/{repo}/releases/download/{tag}/{pathlib.Path(zip_path).name}",
                          "checksum": checksum,
                          "timestamp": timestamp,
                      }
                  ],
              }
          ]
          pathlib.Path("manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

          cat manifest.json
          notes="$(python3 -c 'import json, pathlib; print(json.loads(pathlib.Path("Jellyfin.Plugin.MetaX/meta.json").read_text(encoding="utf-8")).get("changelog", ""))')"

          gh release create "$tag" "$zip" manifest.json \
            --title "MetaX $version" \
            --notes "$notes"

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --json assets \
            --jq '.assets[] | "\(.name) \(.size) bytes"'
